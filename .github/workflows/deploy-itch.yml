name: Export and Deploy to itch.io

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  export-and-deploy:
    name: Export Godot Web and Push to itch.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Export Godot Web build
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: false
          cache: true

      - name: List build output
        run: find ${{ steps.export.outputs.build_directory }} -type f | head -30

      - name: Push to itch.io via Butler
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: html5
          ITCH_GAME: roboverse-the-last-signal
          ITCH_USER: dharanee236
          PACKAGE: ${{ steps.export.outputs.build_directory }}/Web
