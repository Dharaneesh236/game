name: Export Godot Web and Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"
  EXPORT_NAME: "Web"
  BUILD_DIR: "build/web"
  VERCEL_ORG_ID: "team_e0QhE1GVQTU3jNAG9T2HPlTW"
  VERCEL_PROJECT_ID: "prj_5J638QLZHnTzTHurrzrqNWSWA7o4"

jobs:
  export-and-deploy:
    name: Export Godot Web and Deploy to Vercel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        id: cache-godot
        with:
          path: |
            ~/.local/share/godot
            /usr/local/bin/godot
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          mv "Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Download Export Templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_RELEASE }}
          wget -q "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}_export_templates.tpz" -O templates.tpz
          unzip -q templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_RELEASE }}/
          rm -rf templates templates.tpz
          ls ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_RELEASE }}/ | grep web

      - name: Create build directory
        run: mkdir -p ${{ env.BUILD_DIR }}

      - name: Export game as Web
        run: |
          godot --headless --export-release "${{ env.EXPORT_NAME }}" "${{ env.BUILD_DIR }}/index.html" 2>&1
          echo "--- Build output ---"
          ls -lh ${{ env.BUILD_DIR }}

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: |
          vercel deploy ${{ env.BUILD_DIR }} \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --prod \
            --yes
